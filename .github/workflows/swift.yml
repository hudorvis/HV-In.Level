name: In.Level iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check measurements and saved settings
        run: |
          xcrun --sdk macosx swiftc \
            InLevel/Models.swift InLevel/LevelMath.swift Tests/LevelChecks.swift \
            -o "$RUNNER_TEMP/inlevel-checks"
          "$RUNNER_TEMP/inlevel-checks"

      - name: Build In.Level for iPhone and iPad
        run: |
          xcodebuild build \
            -project InLevel.xcodeproj \
            -scheme InLevel \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Capture App Store screenshots
        run: bash scripts/capture-app-store-screenshots.sh "$RUNNER_TEMP/InLevelScreenshots"

      - name: Upload App Store screenshots
        uses: actions/upload-artifact@v4
        with:
          name: In.Level-App-Store-Screenshots
          path: ${{ runner.temp }}/InLevelScreenshots/
          if-no-files-found: error
